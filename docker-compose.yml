services:
  backend:
    build:
      context: ./backend
    environment:
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PUBLIC_API_BASE_URL: http://localhost:8000/api
      VALID_INVITE_CODES: ${VALID_INVITE_CODES:-PHASE0,PHASE1,COCAD}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MAIN_MODEL: ${LLM_MAIN_MODEL:-qwen2.5vl:32b}
      LLM_CHECKER_MODEL: ${LLM_CHECKER_MODEL:-qwen2.5vl:7b}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
